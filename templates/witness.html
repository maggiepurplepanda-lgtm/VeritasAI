<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witness Profiles</title>
    <link rel="stylesheet" href="/static/sidebar.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .app-shell { display: flex; min-height: 100vh; }
        .sidebar {
            width: 250px; background: #111827; border-right: 1px solid #334155;
            padding: 18px 14px; transition: width 0.25s ease;
            position: sticky; top: 0; height: 100vh;
        }
        .sidebar.collapsed { width: 82px; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .brand { display: flex; align-items: center; gap: 10px; color: #38bdf8; font-weight: 700; }
        .brand-mark { font-size: 1.5rem; }
        .brand-text { transition: opacity 0.2s ease; }
        .sidebar.collapsed .brand-text, .sidebar.collapsed .nav-label { display: none; }
        .sidebar-toggle {
            background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
            width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
        }
        .sidebar-nav { display: flex; flex-direction: column; gap: 10px; }
        .sidebar-link {
            display: flex; align-items: center; gap: 12px; color: #cbd5e1; text-decoration: none;
            background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px 14px;
            font-weight: 600; transition: all 0.2s ease;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background: #38bdf8; color: #0f172a; border-color: #38bdf8;
        }
        .content-shell { flex: 1; padding: 28px; }
        .page-card {
            background: #111827; border: 1px solid #334155; border-radius: 18px; padding: 22px;
            max-width: 1200px; margin: 0 auto;
        }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h1 { color: #38bdf8; font-size: 1.8rem; }
        .btn-action {
            background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; padding: 10px 16px;
            font-weight: 700; cursor: pointer;
        }
        .profiles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
        .profile-card {
            background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px;
        }
        .profile-card h3 { color: #38bdf8; margin-bottom: 8px; }
        .meta { color: #94a3b8; font-size: 0.82rem; margin-bottom: 12px; }
        .stat { margin: 6px 0; font-size: 0.85rem; }
        .empty-state { color: #94a3b8; font-style: italic; }
        body, .app-shell { background: var(--bg); color: var(--text); }
        .sidebar, .page-card, .profile-card { background: var(--panel); border-color: var(--border); }
        .sidebar-link, .sidebar-toggle { background: var(--panel-soft); color: var(--text); border-color: var(--border); }
        .btn-action { background: var(--accent); color: var(--accent-contrast); }
        .page-card p { color: var(--muted) !important; }
        html, body { min-height: 100%; }
        body { position: relative; isolation: isolate; overflow-x: hidden; }
        body::before, body::after { content: ""; position: fixed; inset: -25%; z-index: -1; pointer-events: none; background: radial-gradient(circle at 20% 20%, rgba(56,189,248,.22), transparent 32%), radial-gradient(circle at 78% 70%, rgba(99,102,241,.18), transparent 30%), linear-gradient(125deg, #07111f, #172554 48%, #0b1324); animation: liquid-drift 18s ease-in-out infinite alternate; }
        body::after { opacity: .55; filter: blur(45px); animation-duration: 25s; animation-direction: alternate-reverse; }
        .sidebar, .page-card, .profile-card { background: rgba(15,23,42,.64); border-color: rgba(226,232,240,.22); box-shadow: 0 18px 50px rgba(2,6,23,.26), inset 0 1px rgba(255,255,255,.14); backdrop-filter: blur(22px) saturate(135%); -webkit-backdrop-filter: blur(22px) saturate(135%); }
        @keyframes liquid-drift { 0% { transform: translate3d(-2%, -1%, 0) scale(1); } 50% { transform: translate3d(2%, 2%, 0) scale(1.06); } 100% { transform: translate3d(-1%, 3%, 0) scale(1.02); } }
        @media (prefers-reduced-motion: reduce) { body::before, body::after { animation: none; } }
        :root[data-theme="light"] body::before, :root[data-theme="light"] body::after { background: radial-gradient(circle at 20% 20%, rgba(14,116,144,.18), transparent 32%), radial-gradient(circle at 78% 70%, rgba(79,70,229,.14), transparent 30%), linear-gradient(125deg, #dbeafe, #f8fafc 48%, #e0f2fe); }
        :root[data-theme="light"] .sidebar, :root[data-theme="light"] .page-card, :root[data-theme="light"] .profile-card { background: rgba(255,255,255,.72); border-color: rgba(15,23,42,.2); box-shadow: 0 18px 50px rgba(15,23,42,.12), inset 0 1px rgba(255,255,255,.85); }
    </style>
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-mark">⚖️</span>
                    <span class="brand-text">VeritasAI</span>
                </div>
                <button class="sidebar-toggle" aria-label="Toggle Sidebar">☰</button>
            </div>
            <div class="theme-controls">
                <button class="theme-toggle" type="button" aria-label="Toggle light and dark theme" aria-pressed="false">☾ Dark</button>
                <input class="color-picker" type="color" aria-label="Choose accent color" value="#38bdf8">
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link"><span>📊</span><span class="nav-label">Dashboard</span></a>
                <a href="/assistant" class="sidebar-link"><span>🤖</span><span class="nav-label">Assistant</span></a>
                <a href="/witnesses" class="sidebar-link active"><span>👥</span><span class="nav-label">Witnesses</span></a>
                <a href="/post" class="sidebar-link"><span>📄</span><span class="nav-label">Post</span></a>
                <a href="/" class="sidebar-link"><span>🏠</span><span class="nav-label">Landing</span></a>
            </nav>
        </aside>

        <main class="content-shell">
            <div class="page-card">
                <div class="page-header">
                    <h1>Witness Profiles</h1>
                    <button class="btn-action" onclick="loadWitnessProfiles()">Refresh Database</button>
                </div>

                <div id="witnessProfilesDisplay" class="profiles-grid">
                    <div class="empty-state">Click Refresh to load profiles...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/sidebar.js"></script>
    <script>
        function loadWitnessProfiles() {
            fetch('/api/witnesses')
            .then(res => res.json())
            .then(data => {
                const display = document.getElementById('witnessProfilesDisplay');
                display.innerHTML = '';

                if (Object.keys(data).length === 0) {
                    display.innerHTML = '<div class="empty-state">No stored witness profiles found. Save a session first.</div>';
                    return;
                }

                for (const [name, profile] of Object.entries(data)) {
                    const card = document.createElement('div');
                    card.className = 'profile-card';
                    card.innerHTML = `
                        <h3>${name}</h3>
                        <div class="meta">Total Sessions: ${profile.total_sessions}</div>
                        <div class="stat">Avg EAR: <strong>${profile.historical_averages.avg_ear}</strong></div>
                        <div class="stat">Blink Rate: <strong>${profile.historical_averages.blink_rate_ppm}</strong></div>
                        <div class="stat">Kinetic Energy: <strong>${profile.historical_averages.kinetic_energy}</strong></div>
                        <div class="stat">Head Drop: <strong>${profile.historical_averages.head_drop}</strong></div>
                        <div class="stat">Shoulder Angle: <strong>${profile.historical_averages.shoulder_angle}</strong></div>
                    `;
                    display.appendChild(card);
                }
            })
            .catch(err => {
                const display = document.getElementById('witnessProfilesDisplay');
                display.innerHTML = '<div class="empty-state">Unable to load witness profiles right now.</div>';
            });
        }

        window.addEventListener('DOMContentLoaded', loadWitnessProfiles);
    </script>
</body>
</html>
